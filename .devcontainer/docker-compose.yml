version: '3'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    image: syrian-music/syrian-music-www
    env_file: .env
    container_name: syrian-music-www
    command: sleep infinity
    volumes:
      - ../yarn-cache:/root/.yarn
      - ..:/workspace/app
      - ../package.json:/workspace/package.json
      - ../yarn.lock:/workspace/yarn.lock
      - notused:/workspace/app/node_modules

volumes:
  notused:
